<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Leaves - LeavePortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #f8fafc; color: #1e293b; }
        .sidebar { width: 240px; background: #0f172a; color: #94a3b8; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .nav-item.active, .nav-item:hover { background: #1e293b; color: #38bdf8; }
        .main-content { flex: 1; padding: 24px; overflow-y: auto; }
        .table-container { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 18px; text-align: left; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; font-weight: 600; color: #64748b; }
        .badge { padding: 4px 10px; border-radius: 12px; font-weight: 600; font-size: 12px; display: inline-block; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-leaf"></i> LeavePortal</div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="apply-leave.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Apply Leave</a>
        <a href="my-leaves.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i> My Leaves</a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2>My Leave Requests</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Leave Type</th>
                        <th>Dates</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="leavesTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="leave-app.js"></script>
    <script>
        function renderMyLeaves() {
            const tableBody = document.getElementById('leavesTableBody');
            const leaves = getLeaves();
            tableBody.innerHTML = '';

            leaves.forEach(leave => {
                let badgeClass = 'badge-pending';
                if(leave.status === 'Approved') badgeClass = 'badge-approved';
                if(leave.status === 'Rejected') badgeClass = 'badge-rejected';

                tableBody.innerHTML += `
                    <tr>
                        <td><b>${leave.id}</b></td>
                        <td>${leave.type}</td>
                        <td>${leave.dates}</td>
                        <td>${leave.reason}</td>
                        <td><span class="badge ${badgeClass}">${leave.status}</span></td>
                    </tr>
                `;
            });
        }

        window.addEventListener('storage', renderMyLeaves);
        window.onload = renderMyLeaves;
    </script>
</body>
</html>

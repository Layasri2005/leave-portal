<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - LeavePortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #f8fafc; color: #1e293b; }
        .sidebar { width: 240px; background: #0f172a; color: #94a3b8; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .nav-item.active, .nav-item:hover { background: #1e293b; color: #38bdf8; }
        .main-content { flex: 1; padding: 24px; overflow-y: auto; }
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .card-val { font-size: 26px; font-weight: 700; margin-top: 8px; color: #2563eb; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-leaf"></i> AdminPortal</div>
        <a href="admin-dashboard.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Admin Home</a>
        <a href="employee-management.html" class="nav-item"><i class="fa-solid fa-users"></i> Manage Employees</a>
        <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Reports</a>
        <a href="holidays.html" class="nav-item"><i class="fa-solid fa-umbrella-beach"></i> Holidays</a>
        <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 20px;">Admin System Dashboard</h2>
        <div class="card-grid">
            <div class="card">
                <span style="font-size: 13px; color: #64748b;">Total Employees</span>
                <div class="card-val">25</div>
            </div>
            <div class="card">
                <span style="font-size: 13px; color: #64748b;">Managers</span>
                <div class="card-val">3</div>
            </div>
            <div class="card">
                <span style="font-size: 13px; color: #64748b;">Leave Types</span>
                <div class="card-val">5</div>
            </div>
            <div class="card">
                <span style="font-size: 13px; color: #64748b;">Holidays</span>
                <div class="card-val">4</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

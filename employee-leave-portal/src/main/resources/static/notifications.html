<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications - LeavePortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #f8fafc; color: #1e293b; }
        .sidebar { width: 240px; background: #0f172a; color: #94a3b8; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .nav-item.active, .nav-item:hover { background: #1e293b; color: #38bdf8; }
        .main-content { flex: 1; padding: 24px; overflow-y: auto; }
        .notif-item { background: white; padding: 16px 20px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
        .notif-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .notif-approved { background: #dcfce7; color: #16a34a; }
        .notif-pending { background: #fef3c7; color: #d97706; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-leaf"></i> LeavePortal</div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="apply-leave.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Apply Leave</a>
        <a href="my-leaves.html" class="nav-item"><i class="fa-solid fa-list-check"></i> My Leaves</a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
        <a href="notifications.html" class="nav-item active"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 20px;">Notifications</h2>
        <div id="notifContainer"></div>
    </div>
    <script src="app.js"></script>
    <script>
        const leaves = JSON.parse(localStorage.getItem('leaves')) || [];
        const container = document.getElementById('notifContainer');
        
        container.innerHTML = leaves.map(l => `
            <div class="notif-item">
                <div class="notif-icon ${l.status === 'Approved' ? 'notif-approved' : 'notif-pending'}">
                    <i class="fa-solid ${l.status === 'Approved' ? 'fa-check' : 'fa-clock'}"></i>
                </div>
                <div>
                    <h4 style="font-size: 14px;">Your request for ${l.type} (${l.from}) is ${l.status.toLowerCase()}.</h4>
                    <p style="font-size: 12px; color: #64748b;">Status updated recently</p>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
